<h2 mat-dialog-title>Pay settlement #{{ data.row?.settlementNo }}</h2>

<mat-dialog-content>
  <p class="m-b-16">
    Net payable: <strong>₹{{ data.row?.totals?.netAmount || 0 }}</strong>
  </p>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Payout method</mat-label>
    <mat-select [(ngModel)]="method">
      <mat-option value="wallet">Wallet credit to the provider</mat-option>
      <mat-option value="bank">Bank transfer (reference recorded)</mat-option>
    </mat-select>
  </mat-form-field>

  @if (method === 'bank') {
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Payout reference</mat-label>
      <input matInput [(ngModel)]="reference" placeholder="UTR / transfer reference" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Account name</mat-label>
      <input matInput [(ngModel)]="accountName" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Account number</mat-label>
      <input matInput [(ngModel)]="accountNumber" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>IFSC</mat-label>
      <input matInput [(ngModel)]="ifsc" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>UPI id</mat-label>
      <input matInput [(ngModel)]="upiId" />
    </mat-form-field>
  }

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Note</mat-label>
    <textarea matInput rows="2" [(ngModel)]="note"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" [disabled]="submitting" (click)="onSubmit()">
    {{ submitting ? 'Paying…' : 'Pay now' }}
  </button>
</mat-dialog-actions>
