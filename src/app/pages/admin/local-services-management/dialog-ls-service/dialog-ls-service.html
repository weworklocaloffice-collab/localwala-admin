<h2 mat-dialog-title>New service</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-12">
    <mat-form-field appearance="outline"><mat-label>Key</mat-label><input matInput formControlName="key" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Description</mat-label><textarea matInput rows="3" formControlName="description"></textarea></mat-form-field>
    <div class="d-flex flex-column gap-8">
      <input type="file" accept="image/*" (change)="onImageFileSelected($event)" />
      <mat-form-field appearance="outline"><mat-label>Image URL / uploaded path</mat-label><input matInput formControlName="image" placeholder="https://... or uploads/..." /></mat-form-field>
      <img *ngIf="form.get('image')?.value" [src]="form.get('image')?.value" alt="preview" style="max-width:160px;max-height:120px;" />
    </div>
    <mat-form-field appearance="outline"><mat-label>Category id</mat-label><input matInput formControlName="category" /></mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Booking mode</mat-label>
      <mat-select formControlName="bookingMode">
        <mat-option value="INSTANT">INSTANT</mat-option>
        <mat-option value="SLOT">SLOT</mat-option>
        <mat-option value="REQUEST">REQUEST</mat-option>
        <mat-option value="DATE_RANGE">DATE_RANGE</mat-option>
        <mat-option value="RECURRING">RECURRING</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Pricing mode</mat-label>
      <mat-select formControlName="pricingMode">
        <mat-option value="FIXED">FIXED</mat-option>
        <mat-option value="VARIANT">VARIANT</mat-option>
        <mat-option value="HOURLY">HOURLY</mat-option>
        <mat-option value="UNIT_BASED">UNIT_BASED</mat-option>
        <mat-option value="DATE_BASED">DATE_BASED</mat-option>
        <mat-option value="QUOTE">QUOTE</mat-option>
        <mat-option value="INSPECTION_QUOTE">INSPECTION_QUOTE</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Deposit percent (0 = full prepayment)</mat-label>
      <input matInput type="number" min="0" max="100" formControlName="depositPercent" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit">Create draft</button>
</mat-dialog-actions>
