<mat-card class="cardWithShadow">
  <mat-card-header class="m-b-16">
    <mat-card-title>Permissions</mat-card-title>
    <mat-card-subtitle>Local services permission keys</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="permissions" class="w-100">
        <ng-container matColumnDef="permission">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Permission</th>
          <td mat-cell *matCellDef="let element">{{ element }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['permission']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['permission']"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
