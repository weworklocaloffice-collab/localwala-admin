<mat-card class="cardWithShadow">
  <mat-card-header class="m-b-16">
    <mat-card-title>Settings</mat-card-title>
    <mat-card-subtitle>Local services module settings</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="settings" class="w-100">
        <ng-container matColumnDef="key">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Setting</th>
          <td mat-cell *matCellDef="let element">{{ element.key }}</td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Value</th>
          <td mat-cell *matCellDef="let element">{{ element.value }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['key', 'value']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['key', 'value']"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
