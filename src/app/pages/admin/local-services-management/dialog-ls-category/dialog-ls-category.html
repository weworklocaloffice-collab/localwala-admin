<h2 mat-dialog-title>{{ isEdit ? 'Edit category' : util.appTranslate('ls_new_category') }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-12">
    <mat-form-field appearance="outline">
      <mat-label>Key (a-z, 0-9, _)</mat-label>
      <input matInput formControlName="key" />
      @if (isEdit) {
        <mat-hint>Key cannot be changed</mat-hint>
      }
    </mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
    <app-ls-image-upload
      formControlName="image"
      label="Category image"
      (uploadingChange)="isUploading = $event"
    ></app-ls-image-upload>
    <mat-form-field appearance="outline">
      <mat-label>Parent category</mat-label>
      <mat-select formControlName="parent">
        <mat-option value="">None (top level)</mat-option>
        @for (option of parentOptions; track option.id) {
          <mat-option [value]="option.id">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Sort order</mat-label>
      <input matInput type="number" min="0" formControlName="sortOrder" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit || isUploading">{{ isEdit ? 'Save changes' : 'Create draft' }}</button>
</mat-dialog-actions>
