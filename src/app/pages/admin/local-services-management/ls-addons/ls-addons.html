<mat-card class="cardWithShadow">
  <mat-card-header class="m-b-16">
    <mat-card-title>Add-ons</mat-card-title>
    <mat-card-subtitle>Optional extras priced by the pricing engine</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="d-flex justify-content-end mb-24">
      <button mat-flat-button color="primary" (click)="onCreate()">New add-on</button>
    </div>

    <div class="table-responsive">
      <table mat-table [dataSource]="list" class="w-100">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Add-on</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Price</th>
          <td mat-cell *matCellDef="let element">₹{{ element.price }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumn"></tr>
      </table>

      @if (isLoaded && !list.length) {
        <div class="p-24 text-center text-muted">{{ util.appTranslate('ts_no_records_found') }}</div>
      }
    </div>

    <mat-paginator [hidden]="!isLoaded" #paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="pageSize" (page)="onPageChange($event)" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
