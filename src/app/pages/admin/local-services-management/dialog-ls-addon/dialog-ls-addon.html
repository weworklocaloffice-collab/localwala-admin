<h2 mat-dialog-title>New add-on</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-12">
    <mat-form-field appearance="outline"><mat-label>Service id</mat-label><input matInput formControlName="service" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Price ₹</mat-label><input matInput type="number" formControlName="price" /></mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit">Create</button>
</mat-dialog-actions>
