<mat-card class="cardWithShadow">
  <mat-card-header class="m-b-16">
    <mat-card-title>Reviews</mat-card-title>
    <mat-card-subtitle>Customer ratings after completed bookings</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="list" class="w-100">
        <ng-container matColumnDef="provider">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Provider</th>
          <td mat-cell *matCellDef="let element">{{ element.provider }}</td>
        </ng-container>

        <ng-container matColumnDef="booking">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Booking</th>
          <td mat-cell *matCellDef="let element">{{ element.booking }}</td>
        </ng-container>

        <ng-container matColumnDef="rating">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Rating</th>
          <td mat-cell *matCellDef="let element">
            <span class="f-w-600">{{ element.rating }}/5</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="comment">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Comment</th>
          <td mat-cell *matCellDef="let element">
            <div class="f-s-14">{{ element.comment || '—' }}</div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumn"></tr>
      </table>

      @if (isLoaded && !list.length) {
        <div class="p-24 text-center text-muted">{{ util.appTranslate('ts_no_records_found') }}</div>
      }
    </div>

    <mat-paginator [hidden]="!isLoaded" #paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="pageSize" (page)="onPageChange($event)" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
