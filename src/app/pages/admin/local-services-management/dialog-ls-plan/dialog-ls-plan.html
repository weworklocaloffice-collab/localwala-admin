<h2 mat-dialog-title>New subscription plan</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-12">
    <mat-form-field appearance="outline"><mat-label>Code</mat-label><input matInput formControlName="code" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Price (₹)</mat-label><input matInput type="number" formControlName="price" /></mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Interval</mat-label>
      <mat-select formControlName="interval">
        <mat-option value="monthly">Monthly</mat-option>
        <mat-option value="yearly">Yearly</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Entitlements (comma separated)</mat-label><input matInput formControlName="entitlementsText" /></mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit">Create</button>
</mat-dialog-actions>
