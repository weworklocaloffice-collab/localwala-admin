<h2 mat-dialog-title>New featured placement</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-12">
    <mat-form-field appearance="outline">
      <mat-label>Provider (optional)</mat-label>
      <mat-select formControlName="provider">
        <mat-option value="">None</mat-option>
        @for (provider of providers; track provider._id) {
          <mat-option [value]="provider._id">{{ provider.businessName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Service (optional)</mat-label>
      <mat-select formControlName="service">
        <mat-option value="">None</mat-option>
        @for (service of services; track service._id) {
          <mat-option [value]="service._id">{{ service.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Placement</mat-label>
      <mat-select formControlName="placement">
        <mat-option value="home">Home</mat-option>
        <mat-option value="search">Search</mat-option>
        <mat-option value="category">Category</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline"><mat-label>From</mat-label><input matInput type="datetime-local" formControlName="from" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>To</mat-label><input matInput type="datetime-local" formControlName="to" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Price (₹)</mat-label><input matInput type="number" formControlName="price" /></mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit">Create</button>
</mat-dialog-actions>
