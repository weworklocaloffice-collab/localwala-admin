<h2 mat-dialog-title>Generate settlement</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="d-flex flex-column gap-12">
    <mat-form-field appearance="outline">
      <mat-label>Provider</mat-label>
      <mat-select formControlName="providerId">
        @for (provider of providers; track provider._id) {
          <mat-option [value]="provider._id">{{ provider.businessName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline"><mat-label>From</mat-label><input matInput type="datetime-local" formControlName="from" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>To</mat-label><input matInput type="datetime-local" formControlName="to" /></mat-form-field>
    <p class="f-s-12 text-muted m-0">Only applied, unsettled revenue entries are included. Providers without a linked Business return a summary-only result.</p>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit">Generate</button>
</mat-dialog-actions>
