<mat-card class="cardWithShadow">
  <mat-card-header class="m-b-16">
    <mat-card-title>Tax Configuration</mat-card-title>
    <mat-card-subtitle>Tax rates and configuration</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="list" class="w-100">
        <ng-container matColumnDef="key">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Tax</th>
          <td mat-cell *matCellDef="let element">{{ element.key || element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef class="f-w-600">Rate</th>
          <td mat-cell *matCellDef="let element">{{ element.value || element.taxPercent }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumn"></tr>
      </table>
    </div>

    @if (isLoaded && !list.length) {
      <div class="p-24 text-center text-muted">{{ util.appTranslate('ts_no_records_found') }}</div>
    }

    <mat-paginator [hidden]="!isLoaded" #paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="pageSize" (page)="onPageChange($event)" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
