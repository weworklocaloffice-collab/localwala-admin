<h2 mat-dialog-title>Move to {{ status }}</h2>
<mat-dialog-content>
  <p class="f-s-14 text-muted">{{ row.code }} v{{ row.version }} — {{ row.name }}</p>
  <form [formGroup]="statusForm">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ status === 'approved' ? 'Approval note (required)' : 'Reason (optional)' }}</mat-label>
      <textarea matInput formControlName="note" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="isSubmit">Confirm</button>
</mat-dialog-actions>
