<div class="dialog-grid">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" *ngIf="!isEdit">
    <mat-label>Code</mat-label>
    <input matInput formControlName="code" placeholder="temp_abuse" />
    <mat-error *ngIf="form.get('code')?.hasError('required')">Code is required</mat-error>
    <mat-error *ngIf="form.get('code')?.hasError('pattern')">Lowercase letters, numbers, underscores only</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Label</mat-label>
    <input matInput formControlName="label" placeholder="Temperature Abuse" />
    <mat-error *ngIf="form.get('label')?.hasError('required')">Label is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Category</mat-label>
    <mat-select formControlName="category">
      <mat-option *ngFor="let category of categories" [value]="category">{{ category }}</mat-option>
    </mat-select>
    <mat-error *ngIf="form.get('category')?.hasError('required')">Category is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Severity</mat-label>
    <mat-select formControlName="severity">
      <mat-option *ngFor="let severity of severities" [value]="severity">{{ severity }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Fault</mat-label>
    <mat-select formControlName="fault">
      <mat-option *ngFor="let fault of faults" [value]="fault">{{ fault }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Wastage cause</mat-label>
    <mat-select formControlName="wastageCause">
      <mat-option *ngFor="let cause of wastageCauses" [value]="cause">{{ cause }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="span-2">
    <mat-label>Description</mat-label>
    <textarea matInput rows="3" formControlName="description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Sort order</mat-label>
    <input matInput type="number" formControlName="sortOrder" />
  </mat-form-field>

  <div class="span-2 d-flex align-center gap-16 flex-wrap">
    <mat-slide-toggle color="primary" formControlName="autoReject">Auto reject</mat-slide-toggle>
    <mat-slide-toggle color="primary" formControlName="affectsSupplierRating">Affects supplier rating</mat-slide-toggle>
    <mat-slide-toggle color="primary" formControlName="status">Active</mat-slide-toggle>
  </div>
</div>

<div class="d-flex justify-end gap-8 m-t-16">
  <button mat-stroked-button type="button" (click)="dialogRef.close()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="isSaving">
    <mat-icon>save</mat-icon>
    {{ isEdit ? 'Update reason' : 'Create reason' }}
  </button>
</div>
