<h2 mat-dialog-title>{{util.appTranslate('preview')}}</h2>
<mat-dialog-content>
  @if (!isLoaded) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  } @else if (videoUrl) {
  <video [src]="videoUrl" controls playsinline style="width: 100%; max-height: 60vh; border-radius: 8px;"></video>
  @if (status) {
  <p class="m-t-16 op-5">{{status}}</p>
  }
  } @else {
  <p class="op-5">{{util.appTranslate('th_no_media')}}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{util.appTranslate('close')}}</button>
</mat-dialog-actions>
