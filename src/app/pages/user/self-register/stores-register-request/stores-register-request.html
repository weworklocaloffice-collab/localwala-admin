<div class="container mt-4">
  <h2>Stores Partner Registration</h2>
  <p class="text-muted">After registration, download the Partner app to complete your store onboarding.</p>

  <div *ngIf="alertMessage" class="alert alert-info">{{ alertMessage }}</div>

  <form [formGroup]="serviceForm" (ngSubmit)="submit()">
    <div class="row">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Country Code</mat-label>
          <input matInput formControlName="countryCode" />
        </mat-form-field>
      </div>
      <div class="col-md-8">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Mobile</mat-label>
          <input matInput formControlName="mobile" maxlength="10" />
        </mat-form-field>
      </div>
    </div>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" />
    </mat-form-field>

    <div class="mb-3">
      <button type="button" mat-raised-button color="primary" (click)="sendOtp()" [disabled]="isLoading || otpSent">
        Send OTP
      </button>
    </div>

    <div *ngIf="otpSent" class="mb-3">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>OTP</mat-label>
        <input matInput [(ngModel)]="otpCode" [ngModelOptions]="{standalone: true}" maxlength="6" />
      </mat-form-field>
      <button type="button" mat-raised-button color="accent" (click)="verifyOtp()" [disabled]="isLoading || otpVerified">
        Verify OTP
      </button>
    </div>

    <div class="mt-3">
      <button type="submit" mat-raised-button color="primary" [disabled]="submitting || !otpVerified">
        Register
      </button>
    </div>
  </form>
</div>
