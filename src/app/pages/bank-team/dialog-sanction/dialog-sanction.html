<h2 mat-dialog-title>{{ util.appTranslate('bank_sanction_title') }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>{{ util.appTranslate('th_sanctioned_amount') }} ₹</mat-label>
    <input matInput type="number" [(ngModel)]="sanctionedAmount" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">{{ util.appTranslate('th_cancel') }}</button>
  <button mat-flat-button color="primary" [disabled]="sanctionedAmount === null" (click)="onConfirm()">
    {{ util.appTranslate('th_sanction') }}
  </button>
</mat-dialog-actions>
