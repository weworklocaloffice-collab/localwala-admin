<mat-card class="cardWithShadow m-b-16">
  <mat-card-header class="m-b-16">
    <mat-card-title>{{ util.appTranslate('change_password') }}</mat-card-title>
    <mat-card-subtitle>{{ util.appTranslate('change_password_subtitle') }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-form-field appearance="outline" class="w-100 m-b-16">
      <mat-label>{{ util.appTranslate('new_password') }}</mat-label>
      <input matInput [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" />
      <button mat-icon-button matSuffix (click)="showPassword = !showPassword" type="button">
        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-100 m-b-16">
      <mat-label>{{ util.appTranslate('confirm_password') }}</mat-label>
      <input matInput [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" />
      <button mat-icon-button matSuffix (click)="showConfirmPassword = !showConfirmPassword" type="button">
        <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (password && confirmPassword && password !== confirmPassword) {
      <div class="text-error mb-16">{{ util.appTranslate('password_mismatch') }}</div>
    }

    <button
      mat-flat-button
      color="primary"
      [disabled]="isSaving || !password || password !== confirmPassword"
      (click)="onSubmit()"
    >
      {{ util.appTranslate('th_save') }}
    </button>
  </mat-card-content>
</mat-card>
