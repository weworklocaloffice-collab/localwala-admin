<div class="p-4" *ngIf="isLoaded">
  <h2>Loan Lead {{ id }}</h2>
  <div *ngIf="apps.length === 0">No applications for this lead.</div>
  <table mat-table [dataSource]="apps" class="mat-elevation-z2" *ngIf="apps.length">
    <ng-container matColumnDef="app">
      <th mat-header-cell *matHeaderCellDef>Application</th>
      <td mat-cell *matCellDef="let row">{{ rowId(row) }}</td>
    </ng-container>
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let row">{{ row.requestedAmount }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['app','amount','status']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['app','amount','status'];"></tr>
  </table>
</div>
<div class="p-4" *ngIf="!isLoaded">
  <mat-spinner></mat-spinner>
</div>
